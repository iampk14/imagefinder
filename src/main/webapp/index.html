<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ImageFinder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>ImageFinder</h1>

  <div class="controls">
    <input type="text" id="url" placeholder="https://example.com" />
    <button id="start">Start Crawl</button>
    <label>
      <input type="checkbox" id="onlyLogos" />
      Show only logos
    </label>
    <span id="status"></span>
  </div>

  <div id="results-container">
    <div id="spinner"></div>
    <ul id="results"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
